name: Tests

# Deliberately scoped to avoid duplicate runs when a PR is open: push is
# main-only (so a feature-branch push doesn't also fire alongside the
# pull_request run for the same commit), pull_request covers PRs from any
# branch targeting main, workflow_dispatch allows a manual re-run from the
# Actions tab.
"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: source_code/requirements.txt

      - name: Install dependencies
        run: pip install -r source_code/requirements.txt

      # No secrets, no live Ollama/DB/LangSmith - the suite is deliberately
      # built to exercise only deterministic, pure-Python logic (see
      # source_code/tests/conftest.py). LangSmith evaluations and the
      # latency benchmark (source_code/evaluations/) need live services
      # and real credentials and are intentionally NOT run here - they
      # stay manually-run, local tooling.
      - name: Run pytest
        run: pytest source_code/tests/ -v
