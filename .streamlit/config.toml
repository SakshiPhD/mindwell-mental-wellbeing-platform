# Streamlit Configuration

[theme]
primaryColor = "#1976D2"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F2F6"
textColor = "#262730"
font = "sans serif"

[client]
showErrorDetails = false
toolbarMode = "viewer"

[server]
port = 8501
headless = true
runOnSave = false
maxUploadSize = 200

[logger]
level = "info"

[browser]
gatherUsageStats = false
